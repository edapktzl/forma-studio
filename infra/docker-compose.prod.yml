x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    <<: *runtime
    image: caddy:2-alpine
    mem_limit: 128m
    pids_limit: 128
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
      - api

  postgres:
    <<: *runtime
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=64MB", "-c", "effective_cache_size=256MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
    mem_limit: 256m
    stop_grace_period: 60s
    shm_size: 128mb

  api:
    <<: *runtime
    image: ghcr.io/edapktzl/forma-studio-api:${IMAGE_TAG:-latest}
    build: null
    mem_limit: 256m
    pids_limit: 128
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: https://www.edanurpektezel.com,https://admin.edanurpektezel.com

  worker:
    <<: *runtime
    image: ghcr.io/edapktzl/forma-studio-api:${IMAGE_TAG:-latest}
    build: null
    mem_limit: 192m
    pids_limit: 64

  web:
    <<: *runtime
    image: ghcr.io/edapktzl/forma-studio-web:${IMAGE_TAG:-latest}
    build: null
    mem_limit: 384m
    pids_limit: 128
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      NEXT_PUBLIC_API_URL: https://api.edanurpektezel.com/api/v1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  admin:
    <<: *runtime
    image: ghcr.io/edapktzl/forma-studio-admin:${IMAGE_TAG:-latest}
    build: null
    mem_limit: 256m
    pids_limit: 128
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      NEXT_PUBLIC_API_URL: https://api.edanurpektezel.com/api/v1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  api-migrations:
    <<: *runtime
    restart: "no"
    mem_limit: 192m
    image: ghcr.io/edapktzl/forma-studio-api:${IMAGE_TAG:-latest}
    build: null

volumes:
  caddy_data:
  caddy_config:
