name: forma-studio

x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-forma}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@postgres:5432/${POSTGRES_DB:-forma}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forma}
      POSTGRES_USER: ${POSTGRES_USER:-forma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forma} -d ${POSTGRES_DB:-forma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: *database-url
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-studio@example.com}
      MEDIA_UPLOAD_RATE_LIMIT: ${MEDIA_UPLOAD_RATE_LIMIT:-20}
      MEDIA_UPLOAD_RATE_WINDOW_SECONDS: ${MEDIA_UPLOAD_RATE_WINDOW_SECONDS:-3600}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - api_media:/app/storage/media
    depends_on:
      api-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-migrations:
    build:
      context: ../apps/api
    command: alembic upgrade head
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
    command: python -m app.workers.notifications
    environment:
      DATABASE_URL: *database-url
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Forma Studio <notifications@example.com>}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-studio@example.com}
    depends_on:
      api-migrations:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ../apps/admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_media:
