name: Validate and deploy applications
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['.', 'apps/admin']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: python -m pytest tests -q

  publish-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, api]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # GHCR images are the deployable artifacts; Buildx's separate .dockerbuild
      # records only add noise and storage usage to the Actions artifact list.
      DOCKER_BUILD_RECORD_UPLOAD: false
    concurrency:
      group: forma-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: ghcr.io/edapktzl/forma-studio-web:latest,ghcr.io/edapktzl/forma-studio-web:main-${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=https://api.edanurpektezel.com/api/v1
          labels: org.opencontainers.image.source=https://github.com/edapktzl/forma-studio
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/admin
          file: apps/admin/Dockerfile
          push: true
          tags: ghcr.io/edapktzl/forma-studio-admin:latest,ghcr.io/edapktzl/forma-studio-admin:main-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.edanurpektezel.com/api/v1
            NEXT_PUBLIC_SITE_URL=https://www.edanurpektezel.com
          labels: org.opencontainers.image.source=https://github.com/edapktzl/forma-studio
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/edapktzl/forma-studio-api:latest,ghcr.io/edapktzl/forma-studio-api:main-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/edapktzl/forma-studio
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Deploy over verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Verified against the previously trusted local known_hosts entry.
          VPS_FINGERPRINT: SHA256:wQ7xkoTMTZrKiGqHw9EJqwcbdvPs/LgWjJqWOfHN7/U
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          key_file=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          chmod 600 "$key_file" "$known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          ssh-keyscan -T 15 -t ed25519 "$VPS_HOST" 2>/dev/null > "$known_hosts"
          actual=$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [[ "$actual" != "$VPS_FINGERPRINT" ]]; then
            echo 'SSH host fingerprint mismatch; deployment stopped.' >&2
            exit 1
          fi
          ssh_options=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts" -o ConnectTimeout=15)
          scp "${ssh_options[@]}" infra/docker-compose.yml infra/docker-compose.prod.yml infra/Caddyfile scripts/deploy-oci.sh scripts/backup-postgres.sh "$VPS_USER@$VPS_HOST:/opt/forma-studio/"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "bash /opt/forma-studio/deploy-oci.sh main-$GITHUB_SHA"
