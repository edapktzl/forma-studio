name: Validate applications
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['.', 'apps/admin']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  publish-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/edapktzl/forma-studio-web
            ghcr.io/edapktzl/forma-studio-admin
            ghcr.io/edapktzl/forma-studio-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: ghcr.io/edapktzl/forma-studio-web:latest,ghcr.io/edapktzl/forma-studio-web:main-${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=https://api.edanurpektezel.com/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: apps/admin
          file: apps/admin/Dockerfile
          push: true
          tags: ghcr.io/edapktzl/forma-studio-admin:latest,ghcr.io/edapktzl/forma-studio-admin:main-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.edanurpektezel.com/api/v1
            NEXT_PUBLIC_SITE_URL=https://www.edanurpektezel.com
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/edapktzl/forma-studio-api:latest,ghcr.io/edapktzl/forma-studio-api:main-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/docker-compose.yml,infra/docker-compose.prod.yml,infra/Caddyfile"
          target: /opt/forma-studio
          strip_components: 1
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/forma-studio
            export IMAGE_TAG=main-${{ github.sha }}
            compose='docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml'
            trap '$compose ps; $compose logs --tail=80 api caddy || true' ERR
            $compose pull
            $compose up -d --remove-orphans
            for attempt in $(seq 1 12); do
              if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
                break
              fi
              if [ "$attempt" = 12 ]; then
                echo 'API did not become healthy in 60 seconds.'
                exit 1
              fi
              sleep 5
            done
            $compose ps
            docker image prune -f
